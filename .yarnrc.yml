# Yarn 4 (Berry). node-modules linker, not PnP — maximum tooling compatibility (tsx, vitest, editors)
# with zero PnP shims. The Yarn version itself is pinned via `packageManager` in package.json, resolved
# by Corepack / proto — so the release binary is not vendored into the repo.
nodeLinker: node-modules
enableTelemetry: false

# This repo pins EXACT dependency versions (no ^/~ ranges). An empty range prefix makes `yarn add` pin by
# default, so a future add can't reintroduce a floating range.
defaultSemverRangePrefix: ""

# Every file in node_modules is a HARDLINK into one content-addressed store under the global folder, so a
# second checkout of this repository costs directory entries rather than a second copy of the tree.
#
# This is what makes the owner's v1 rule — every worktree installs its OWN node_modules, none is ever a
# symlink to a shared one — affordable at the scale this repository actually runs at. Measured with
# 247 registered worktrees on a volume with 68 GiB free:
#
#   nmMode: classic (the default)   2.41 GiB per worktree   →  596 GB for the fleet
#   nmMode: hardlinks-global          316 KiB per worktree   →  2.1 GB store + 76 MiB for the fleet
#
# Reproduce either with `du -sch ~/.yarn/berry/store <worktree>/node_modules` — the union stays at the
# store's own size when the links are real. The trade, stated rather than discovered: a tool that MUTATES a
# file inside node_modules in place edits the store, and therefore every checkout linked to it. Build scripts
# are disabled and this project patches nothing (the docs site's one Nextra patch is its own project's, and
# Yarn applies a patch into a new package, never in place), so nothing in THIS repo does — but yarn itself does, and that is not
# hypothetical: `copyFileViaIndex`'s autoRepair path rewrites a store entry in place whenever a destination
# already links to it and the entry's mtime is not yarn's SAFE_TIME sentinel. One such write over a native
# binary condemns it in every checkout at once, permanently (see src/worktree/execInodes.ts).
# Every install therefore ends by relinking this tree's Mach-O images to Slopweaver's own exec store; see
# `slopweaver worktree unshare`.
nmMode: hardlinks-global

# Supply-chain defence: refuse any package version published less than 7 days ago. A compromised release
# is typically caught and yanked within hours-to-days of publication, so a freshness floor turns the window
# where a malicious version can enter this tree from "immediately" into "only if it survives a week of the
# rest of the ecosystem looking at it". Yarn's own default is 1 day (`npmMinimalAgeGate`, a DURATION in
# minutes) — this raises it to 7. Read the effective value back with:
#
#   yarn config --json | grep npmMinimalAgeGate
#
# The escape hatch, if a version ever genuinely has to land inside the window, is `npmPreapprovedPackages`
# (a list of package descriptors or name globs) — an explicit, reviewable line in this file, never a flag
# passed at the command line.
npmMinimalAgeGate: 7d

# The console voice's plan-funded mint rides `thread/realtime/start` protocol v3 and the chatgpt.com voices, which
# first shipped in codex-cli 0.157.1 (published inside the 7-day window). The owner already
# runs that exact release as their own `codex` (`codex --version` → codex-cli 0.157.1), so this admits
# the one version, by exact descriptor, and nothing newer. Remove these lines once 0.157.1 is older than 7 days.
npmPreapprovedPackages:
  - "@openai/codex@0.157.1"
  - "@openai/codex@0.157.1-darwin-arm64"
  - "@openai/codex@0.157.1-darwin-x64"
  - "@openai/codex@0.157.1-linux-arm64"
  - "@openai/codex@0.157.1-linux-x64"
  - "@openai/codex@0.157.1-win32-arm64"
  - "@openai/codex@0.157.1-win32-x64"
  - "@openai/codex-sdk@0.157.1"
