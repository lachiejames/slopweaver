# Turn-level judgement eval (v0.1) — the judgement-bug class: 5 review
# rounds on one ask, and a follow-up worker drafting "nothing ran" while the first worker was alive.
#
# Each case's prompt is hand-written from the incident narratives already in `turn.cases.json` and the
# committed doc comments they cite (`src/live/ask/burst.ts`, `src/reflect/collectReview.ts`) — the frozen
# replay fixtures under `src/__tests__/fixtures/replay/` exist for the deterministic subprocess replay lane
# and are redacted structurally, so they are not themselves a usable model prompt.
#
# This is the only promptfoo lane left — the deterministic grounding harness beside it was deleted with the
# local indexes it scored. It calls a real model through `turnProvider.ts` — the one lane
# AGENTS.md's owner ruling names "the one lane that judges judgement". ADVISORY ONLY: not wired into
# CI or `yarn validate`; see AGENTS.md § "Turn-level eval cases" for why.
description: Slopweaver turn-level judgement harness (v0.1)

prompts:
  - "{{prompt}}"

providers:
  - id: file://./turnProvider.ts
    label: turn@working-tree

tests: file://./turnCases.ts

# One case at a time: each case routes through the same read-only usage-limit preflight a seat takes
# (`decideCodexSeat`), so concurrent cases would all read the same headroom and could cross a limit together.
evaluateOptions:
  maxConcurrency: 1
